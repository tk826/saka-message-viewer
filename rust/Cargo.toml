[package]
name = "message-viewer"
version = "0.1.1"
edition = "2024"
# str::trim_prefix(1.100)・Option/Result::map_or_default(1.98) を使うため 1.100 以上
# (古い Rust では「1.100 以上が必要」と分かりやすく止まる)
rust-version = "1.100"
description = "坂道メッセージビューア"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: config.json の書き戻しでキー順を保つ。APIのキー順も挿入順になる
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }

# HTTPサーバ / DB
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
# bundled SQLite は FTS5 有効。trigram トークナイザは SQLite>=3.34 が必要(bundled は十分新しい)
# functions: 検索で使う SQL 関数(mv_fold)を登録するため
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
form_urlencoded = "1"

# ファイル配信(ストリーミング)
futures-util = { version = "0.3", default-features = false }

# 取り込み(サムネ生成・サムネのパス)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
sha1 = "0.10"

# 取り込みロック(.index.lock)の PID 生存確認
[target.'cfg(windows)'.dependencies]
# Win32_System_Console: ダブルクリックで起動されたかの判定(失敗時に Enter を待つため)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
