<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坂道メッセージビューア</title>
<style>
/* ==========================================================================
   坂道メッセージビューア スタイル
   CSS変数でライト(スカイブルー)/ダークを切替
   ========================================================================== */

:root,
:root[data-theme="light"] {
  --bg: #dbf0f9;
  --bg-gradient: #dbf0f9;
  --sidebar-bg: #ffffff;
  --sidebar-border: #d7ebf3;
  --header-bg: #a9d7ec;
  --header-border: #d7ebf3;
  --text: #1b1b1b;
  --text-sub: #6b7680;
  --text-faint: #9aa4ad;
  --bubble-bg: #ffffff;
  --bubble-text: #1b1b1b;
  --bubble-shadow: 0 1px 2px rgba(0,0,0,0.12);
  --bubble-missing-bg: #f2e9e9;
  --accent: #0a77ab;
  --accent-text: #ffffff;
  --hover: #eef8fc;
  --selected-bg: #dbf0f9;
  --selected-border: #0a77ab;
  --divider: #457c98;
  --divider-text: #ffffff;
  --input-bg: #f0f8fb;
  --input-border: #cde6f0;
  --scrollbar: #bfdeeb;
  --danger: #d84343;
  --panel-bg: #ffffff;
  --panel-border: #d7ebf3;
  --overlay: rgba(0,0,0,0.6);
  --mark-bg: #fff1a8;
  --mark-text: #1b1b1b;
  --favorite-star: #e8b62c;
}

:root[data-theme="dark"] {
  --bg: #1c333e;
  --bg-gradient: #1c333e;
  --sidebar-bg: #1c2126;
  --sidebar-border: #2a3138;
  --header-bg: #14181c;
  --header-border: #2a3138;
  --text: #e7ebee;
  --text-sub: #9aa7b0;
  --text-faint: #6d7981;
  --bubble-bg: #2a3138;
  --bubble-text: #e7ebee;
  --bubble-shadow: 0 1px 2px rgba(0,0,0,0.4);
  --bubble-missing-bg: #3a2c2c;
  --accent: #166f94;
  --accent-text: #ffffff;
  --hover: #212a30;
  --selected-bg: #1c333e;
  --selected-border: #166f94;
  --divider: #234050;
  --divider-text: #cfe8f2;
  --input-bg: #242a30;
  --input-border: #363e46;
  --scrollbar: #3a4148;
  --danger: #e06767;
  --panel-bg: #1c2126;
  --panel-border: #2a3138;
  --overlay: rgba(0,0,0,0.75);
  --mark-bg: #5c5220;
  --mark-text: #ffe98a;
  --favorite-star: #e8b62c;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c333e;
    --bg-gradient: #1c333e;
    --sidebar-bg: #1c2126;
    --sidebar-border: #2a3138;
    --header-bg: #14181c;
    --header-border: #2a3138;
    --text: #e7ebee;
    --text-sub: #9aa7b0;
    --text-faint: #6d7981;
    --bubble-bg: #2a3138;
    --bubble-text: #e7ebee;
    --bubble-shadow: 0 1px 2px rgba(0,0,0,0.4);
    --bubble-missing-bg: #3a2c2c;
    --accent: #166f94;
    --accent-text: #ffffff;
    --hover: #212a30;
    --selected-bg: #1c333e;
    --selected-border: #166f94;
    --divider: #234050;
    --divider-text: #cfe8f2;
    --input-bg: #242a30;
    --input-border: #363e46;
    --scrollbar: #3a4148;
    --danger: #e06767;
    --panel-bg: #1c2126;
    --panel-border: #2a3138;
    --overlay: rgba(0,0,0,0.75);
    --mark-bg: #5c5220;
    --mark-text: #ffe98a;
    --favorite-star: #e8b62c;
  }
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo",
    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------------- Header ---------------- */
#header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
  flex-shrink: 0;
  flex-wrap: wrap;
}

#appTitle {
  font-size: 1rem;
  font-weight: 600;
  margin: 0;
  white-space: nowrap;
}

.icon-btn {
  background: transparent;
  border: none;
  font-size: 1.125rem;
  cursor: pointer;
  color: var(--text);
  padding: 6px 8px;
  border-radius: 6px;
  line-height: 1;
}
.icon-btn:hover { background: var(--hover); }

/* お気に入りボタンはライト/ダーク両方で視認しやすい落ち着いた黄色にする */
#favoritesBtn { color: var(--favorite-star); }

.btn {
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8125rem;
  font-weight: 600;
  white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.5; cursor: default; }

.btn-ghost {
  background: transparent;
  color: var(--text-sub);
  font-weight: 400;
}
.btn-ghost:hover { background: var(--hover); }

#searchBar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  flex-wrap: wrap;
  min-width: 260px;
}

#searchInput {
  flex: 1;
  min-width: 140px;
  padding: 7px 10px;
  border-radius: 6px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 0.8125rem;
}

.scope-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75rem;
  color: var(--text-sub);
  white-space: nowrap;
  cursor: pointer;
}

#searchFrom, #searchTo {
  padding: 6px 6px;
  border-radius: 6px;
  border: 1px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 0.75rem;
  max-width: 140px;
}

.range-sep { color: var(--text-faint); font-size: 0.75rem; }

#headerActions {
  display: flex;
  align-items: center;
  gap: 4px;
}

#reindexStatusBar {
  background: var(--selected-bg);
  color: var(--text);
  font-size: 0.75rem;
  padding: 6px 14px;
  border-bottom: 1px solid var(--panel-border);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

#reindexStatusBar.is-error,
#reindexStatusBar.is-interrupted {
  background: var(--bubble-missing-bg);
  color: var(--danger);
}

#reindexStatusRow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#reindexPhaseLabel {
  font-weight: 700;
  white-space: nowrap;
}

#reindexDetailText {
  color: var(--text-sub);
  white-space: nowrap;
}
#reindexStatusBar.is-error #reindexDetailText,
#reindexStatusBar.is-interrupted #reindexDetailText {
  color: var(--danger);
}

#reindexEtaText {
  color: var(--text-faint);
  white-space: nowrap;
  margin-left: auto;
}
#reindexStatusBar.is-error #reindexEtaText,
#reindexStatusBar.is-interrupted #reindexEtaText {
  color: var(--danger);
}

#reindexProgressTrack {
  height: 6px;
  border-radius: 3px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  overflow: hidden;
  position: relative;
}

#reindexProgressFill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s ease;
}
#reindexStatusBar.is-error #reindexProgressFill,
#reindexStatusBar.is-interrupted #reindexProgressFill {
  background: var(--danger);
}

/* 総数不明フェーズ(scanning)用の不定形プログレスバー */
#reindexProgressTrack.indeterminate #reindexProgressFill {
  width: 35% !important;
  animation: reindex-indeterminate 1.3s ease-in-out infinite;
}

@keyframes reindex-indeterminate {
  0%   { margin-left: -35%; }
  100% { margin-left: 100%; }
}

/* ---------------- Body layout ---------------- */
#body {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

#sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  overflow-y: auto;
  transition: margin-left 0.2s ease;
}

#memberListWrap { padding: 6px 0; }

.hint {
  color: var(--text-faint);
  font-size: 0.8125rem;
  padding: 16px;
  text-align: center;
}

.group-heading {
  font-size: 0.6875rem;
  font-weight: 700;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 12px 14px 4px;
}

.member-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.member-item:hover { background: var(--hover); }
.member-item.selected {
  background: var(--selected-bg);
  border-left-color: var(--selected-border);
}

.member-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.875rem;
  font-weight: 700;
  flex-shrink: 0;
}

.member-meta {
  min-width: 0;
  flex: 1;
}

.member-name {
  font-size: 0.875rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}

.member-sub {
  font-size: 0.6875rem;
  color: var(--text-sub);
  display: flex;
  justify-content: space-between;
  gap: 6px;
}

/* ---------------- Main ---------------- */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--bg-gradient);
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-sub);
  font-size: 0.875rem;
  padding: 20px;
  text-align: center;
}

#timelineWrap {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}

#timeline {
  flex: 1;
  overflow-y: auto;
  padding: 16px 4% 16px;
  scrollbar-color: var(--scrollbar) transparent;
}

.hidden { display: none !important; }

.load-sentinel {
  text-align: center;
  color: var(--text-faint);
  font-size: 0.75rem;
  padding: 8px;
  min-height: 20px;
}

.date-sep {
  text-align: center;
  margin: 14px 0;
}
.date-sep span {
  background: var(--divider);
  color: var(--divider-text);
  font-size: 0.6875rem;
  padding: 3px 12px;
  border-radius: 10px;
}

/* ---------------- 日付セパレータ (フローティング表示) ----------------
   Timelineは間引き型の仮想スクロールのため、.date-sep自体にposition:stickyを
   付けると間引きの瞬間に表示が飛ぶ。そのため独立した浮遊要素として#timelineWrap
   に重ねて表示し、スクロール位置に応じてテキストのみ書き換える方式にする。 */
#stickyDateSep {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  background: var(--divider);
  color: var(--divider-text);
  font-size: 0.6875rem;
  padding: 3px 12px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  pointer-events: none;
}

.msg-row {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin: 10px 0;
  max-width: 70%;
}

.msg-bubble {
  background: var(--bubble-bg);
  color: var(--bubble-text);
  border-radius: 14px;
  border-top-left-radius: 4px;
  box-shadow: var(--bubble-shadow);
  padding: 8px 10px;
  /* .msg-bubble-row(flex)の子になったため、幅は内容に応じて伸縮する。
     min-width:0でテキストの折り返しがflexの最小幅制約に邪魔されないようにする */
  min-width: 0;
  word-break: break-word;
  white-space: pre-wrap;
  font-size: 0.9062rem;
  line-height: 1.5;
}

.msg-bubble.missing-body {
  background: var(--bubble-missing-bg);
}

.msg-time {
  font-size: 0.6562rem;
  color: var(--text-sub);
  margin-top: 3px;
  padding-left: 4px;
}

.msg-media {
  margin-bottom: 6px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(0,0,0,0.06);
  min-height: 60px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* video/audioの音量ブースト行は常に自身の行いっぱいに幅をとり、
   video/imgの隣に並ばず必ず下の行に折り返される。 */
.msg-media .volume-boost-row {
  flex-basis: 100%;
}

.msg-media img.thumb-img {
  max-width: 100%;
  max-height: 320px;
  display: block;
  cursor: pointer;
  object-fit: contain;
}

.msg-media video {
  max-width: 100%;
  max-height: 360px;
  display: block;
  background: #000;
}

.media-placeholder {
  width: 220px;
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  font-size: 0.75rem;
  background: var(--input-bg);
}

.play-badge {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.125rem;
  pointer-events: none;
}

.audio-tag {
  position: absolute;
  top: 6px;
  left: 6px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 0.6875rem;
  padding: 2px 6px;
  border-radius: 8px;
  pointer-events: none;
}

.volume-boost-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 4px 8px;
  box-sizing: border-box;
  background: rgba(0,0,0,0.06);
}

/* 設定「動画・音声に音量ブースターを表示する」がOFFの場合、
   全メッセージの音量ブースト行を一括で隠す。 */
body.volume-boost-disabled .volume-boost-row {
  display: none;
}

.volume-boost-label {
  font-size: 0.6875rem;
  color: var(--text-faint);
  flex-shrink: 0;
}

.volume-boost-slider {
  flex: 1;
  min-width: 0;
}

.volume-boost-value {
  font-size: 0.6875rem;
  color: var(--text-faint);
  flex-shrink: 0;
  min-width: 3em;
  text-align: right;
  white-space: nowrap;
}

.volume-boost-row--disabled {
  opacity: 0.5;
}

.volume-boost-row--disabled .volume-boost-slider {
  cursor: not-allowed;
}

.missing-media {
  width: 220px;
  height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--bubble-missing-bg);
  color: var(--danger);
  font-size: 0.75rem;
  opacity: 0.85;
}

.missing-flag {
  color: var(--danger);
  font-size: 0.6875rem;
  font-weight: 700;
  margin-bottom: 4px;
}

/* ---------------- メッセージ行アクション (お気に入り/パスコピー) ---------------- */
/* バブルとアクション群を横並びにし、バブルのすぐ右にボタンを出す。
   アクションはflex-shrink:0で幅固定、バブルは残り幅の中で内容に応じて伸縮する。 */
.msg-bubble-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  max-width: 100%;
}

.msg-row-actions {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
  opacity: 0;
  pointer-events: none;
  /* 非表示への切り替えだけ遅延させ、バブル→ボタンへのマウス移動中に消えないようにする。
     表示は遅延なし、非表示は0.2s待ってから、という非対称にする。 */
  transition: opacity 0.15s ease 0.2s;
}
/* ホバー領域はバブル+アクションのラッパー全体にし、隙間を移動する間も維持されるようにする */
.msg-bubble-row:hover .msg-row-actions,
.msg-row-actions:hover,
.msg-row-actions.has-favorite {
  opacity: 1;
  pointer-events: auto;
  transition-delay: 0s;
}

.msg-action-btn {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  color: var(--text-sub);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.8125rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--bubble-shadow);
  line-height: 1;
}
.msg-action-btn:hover { background: var(--hover); }
.msg-action-btn.fav-btn.is-favorited { color: var(--favorite-star); }

@media (hover: none) {
  /* タッチデバイスはホバーできないため、アクションボタンを常時表示にする */
  .msg-row-actions { opacity: 1; pointer-events: auto; }
}

#scrollBottomBtn {
  position: absolute;
  right: 20px;
  bottom: 20px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.125rem;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}

/* ---------------- Panels (calendar / search) ---------------- */
.panel {
  position: absolute;
  top: 8px;
  right: 12px;
  left: 12px;
  max-width: 520px;
  margin-left: auto;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  z-index: 20;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--panel-border);
  font-size: 0.8125rem;
  font-weight: 600;
}

.panel-body {
  overflow-y: auto;
  padding: 10px 12px;
}

.calendar-year {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-sub);
  margin: 10px 0 4px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.calendar-month {
  background: var(--input-bg);
  border-radius: 6px;
  padding: 6px 4px;
  text-align: center;
  cursor: pointer;
  font-size: 0.75rem;
}
.calendar-month:hover { background: var(--hover); outline: 1px solid var(--selected-border); }
.calendar-month .cm-label { font-weight: 600; }
.calendar-month .cm-count { color: var(--text-sub); font-size: 0.6562rem; }

.calendar-back {
  padding: 2px 8px;
  margin-right: 6px;
  font-size: 0.875rem;
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 4px;
}
.calendar-weekdays span {
  text-align: center;
  font-size: 0.6875rem;
  color: var(--text-sub);
}

.calendar-daygrid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-size: 0.75rem;
}
.calendar-day.empty { visibility: hidden; }
.calendar-day.has-messages {
  background: var(--input-bg);
  cursor: pointer;
}
.calendar-day.has-messages:hover { background: var(--hover); outline: 1px solid var(--selected-border); }
.calendar-day.no-messages { color: var(--text-sub); opacity: 0.4; }

.search-result-item {
  padding: 8px 6px;
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;
  font-size: 0.8125rem;
}
.search-result-item:hover { background: var(--hover); }
.search-result-item .sr-meta {
  font-size: 0.6875rem;
  color: var(--text-sub);
  margin-bottom: 3px;
  display: flex;
  gap: 8px;
}
.search-result-item .sr-snippet mark {
  background: var(--mark-bg);
  color: var(--mark-text);
  padding: 0 1px;
  border-radius: 2px;
}

/* ---------------- お気に入り一覧パネル ---------------- */
.favorite-item {
  display: flex;
  gap: 8px;
  padding: 8px 6px;
  border-bottom: 1px solid var(--panel-border);
  cursor: pointer;

<script>
"use strict";
/* ==========================================================================
   坂道メッセージビューア フロントエンド (バニラJS / 外部依存なし)
   ========================================================================== */

// ---------------------------------------------------------------------------
// ユーティリティ
// ---------------------------------------------------------------------------

function qs(sel, root) { return (root || document).querySelector(sel); }
function ce(tag, cls) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  return el;
}
function escapeHtml(s) {
  if (s == null) return "";
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function applyNicknamePlaceholder(s) {
  if (s == null) return s;
  const nickname = DisplayPrefs.load().nickname;
  return s.replaceAll("%%%", nickname).replaceAll("％％％", nickname);
}

function jstDateParts(ts) {
  // ts は unix epoch 秒 (UTC)。JST = UTC+9。
  const d = new Date((ts + 9 * 3600) * 1000);
  return {
    y: d.getUTCFullYear(),
    m: d.getUTCMonth() + 1,
    day: d.getUTCDate(),
    hh: d.getUTCHours(),
    mm: d.getUTCMinutes(),
    dow: d.getUTCDay(),
  };
}

function formatDateSep(ts) {
  const p = jstDateParts(ts);
  const dowNames = ["日", "月", "火", "水", "木", "金", "土"];
  return `${p.y}年${p.m}月${p.day}日 (${dowNames[p.dow]})`;
}

function formatTime(ts) {
  const p = jstDateParts(ts);
  return `${String(p.hh).padStart(2, "0")}:${String(p.mm).padStart(2, "0")}`;
}

function dateKey(ts) {
  const p = jstDateParts(ts);
  return `${p.y}-${p.m}-${p.day}`;
}

function toast(msg, isError) {
  const el = qs("#toast");
  el.textContent = msg;
  el.classList.remove("hidden");
  el.classList.toggle("error", !!isError);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add("hidden"), 3500);
}

// 調査用コンソールログ(Sidebar.loadの所要時間計測等)の出力可否。
// /api/settings のレスポンス(is_dev, config-dev.json使用時のみtrue)を
// Settings.checkOnStartup() が受け取ってここに反映する。
// App.init() は checkOnStartup() の完了を待ってから他の初期化を行うため、
// それ以降のコードからはこの値を参照できる。
let isDevMode = false;

// サーバ側のSQLite busy_timeout(30秒)に合わせた既定タイムアウト。
// 取り込み中に読み取りリクエストがロック待ちで詰まった場合、fetch自体は
// ブラウザ側では無期限に待ち続けてしまう(=画面が「読み込み中...」のまま
// 固まって見える)ため、ここで打ち切ってユーザーに状況を伝えられるようにする。
const FETCH_TIMEOUT_MS = 35000;

async function fetchJson(url, opts) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  let res;
  try {
    res = await fetch(url, { ...opts, signal: controller.signal });
  } catch (e) {
    if (e.name === "AbortError") {
      throw new Error("サーバの応答がありません(タイムアウト)。取り込み処理が重い可能性があります。");
    }
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
  if (!res.ok) {
    let detail = "";
    try {
      const j = await res.json();
      detail = j.detail || JSON.stringify(j);
    } catch (e) { /* ignore */ }
    throw new Error(`HTTP ${res.status} ${detail}`);
  }
  return res.json();
}

// ---------------------------------------------------------------------------
// テーマ
// ---------------------------------------------------------------------------
const Theme = {
  KEY: "msgviewer_theme",
  init() {
    const saved = localStorage.getItem(this.KEY);
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
    const select = qs("#settingsTheme");
    select.value = saved === "light" || saved === "dark" ? saved : "";
    select.addEventListener("change", () => this.set(select.value));
  },
  current() {
    const attr = document.documentElement.getAttribute("data-theme");
    if (attr) return attr;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  },
  set(value) {
    if (value === "light" || value === "dark") {
      document.documentElement.setAttribute("data-theme", value);
      localStorage.setItem(this.KEY, value);
    } else {
      document.documentElement.removeAttribute("data-theme");
      localStorage.removeItem(this.KEY);
    }
  },
};

// ---------------------------------------------------------------------------
// 音量ブースト (Web Audio API)
//
// <video>/<audio>のネイティブcontrolsの音量は0〜100%までしか上げられない
// (ブラウザの仕様上の上限)。100%を超えて増幅するにはWeb Audio APIで
// MediaElementAudioSourceNode -> GainNode -> destination という処理グラフを
// 組み、GainNodeのgain値で信号自体を増幅する必要がある。
// createMediaElementSourceは同一要素に対して一度しか呼べない(2回目は例外に
// なる)ため、要素ごとにノードをキャッシュして使い回す。
// また、その要素の音声出力は以後このグラフ経由のみになる(GainNode接続前は
// 無音)ため、接続と同時にdestinationまで繋ぐ。
// AudioContextはユーザー操作なしで自動再生ポリシーによりsuspendされたまま
// になることがあるため、スライダー操作時にresume()する。
// ---------------------------------------------------------------------------
const VolumeBoost = {
  MAX_GAIN: 2.0, // 200%
  _ctx: null,
  _nodes: new WeakMap(), // mediaEl -> { source, gain }

  _getContext() {
    if (!this._ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this._ctx = new AC();
    }
    return this._ctx;
  },

  _getGainNode(mediaEl) {
    let entry = this._nodes.get(mediaEl);
    if (!entry) {
      const ctx = this._getContext();
      const source = ctx.createMediaElementSource(mediaEl);
      const gain = ctx.createGain();
      source.connect(gain);
      gain.connect(ctx.destination);
      entry = { source, gain };
      this._nodes.set(mediaEl, entry);
    }
    return entry.gain;
  },

  // pct: 0〜200 (%)。100%まではブラウザ標準のvideo.volumeで賄い、
  // GainNodeのgainは常に1.0以下に保つ(念のためAudioContext側では増幅しない
  // 経路も許容し、100%以下の操作でWeb Audio APIの初期化自体を避ける)。
  // 100%を超えた分だけGainNodeで増幅する。
  apply(mediaEl, pct) {
    const clamped = Math.max(0, Math.min(200, pct));
    if (clamped <= 100) {
      mediaEl.volume = clamped / 100;
      const entry = this._nodes.get(mediaEl);
      if (entry) entry.gain.gain.value = 1.0;
      return;
    }
    mediaEl.volume = 1.0;
    const ctx = this._getContext();
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const gainNode = this._getGainNode(mediaEl);
    gainNode.gain.value = clamped / 100;
  },
};

// ---------------------------------------------------------------------------
// メディア遅延ロード (IntersectionObserver)
// ---------------------------------------------------------------------------
const LazyMedia = {
  observer: null,
  init() {
    this.observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (entry.isIntersecting) {
          this.load(entry.target);
          this.observer.unobserve(entry.target);
        }
      }
    }, { root: qs("#timeline"), rootMargin: "300px 0px" });
  },
  observe(el) {
    this.observer.observe(el);
  },
  load(el) {
    const src = el.getAttribute("data-src");
    if (!src) return;
    if (el.tagName === "IMG") {
      el.addEventListener("load", () => Timeline.stickToBottomIfNeeded(), { once: true });
      el.src = src;
    } else if (el.tagName === "VIDEO") {
      const source = ce("source");
      source.src = src;
      source.type = el.getAttribute("data-type") || "video/mp4";
      el.appendChild(source);
    }
    el.removeAttribute("data-src");
  },
};

const Favorites = {
  ids: new Set(),        // 現在選択中メンバーの msg_id 集合 (★の初期状態反映用)
  _loadedMember: null,   // ids がどのメンバー分か (同一メンバーへの再ジャンプで再取得を省くため)

  async loadForMember(member) {
    this.ids = new Set();
    this._loadedMember = member || null;
    if (!member) return;
    try {
      const data = await fetchJson(`/api/favorites/ids?member=${encodeURIComponent(member)}`);
      this.ids = new Set(data.msg_ids || []);
    } catch (e) {
      console.error(e);
    }
  },

  has(msgId) {
    return this.ids.has(Number(msgId));
  },

  async toggle(member, msgId, btnEl) {
    const id = Number(msgId);
    const nowFav = !this.has(id);
    try {
      if (nowFav) {
        await fetchJson("/api/favorites", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ member, msg_id: id }),
        });
        this.ids.add(id);
      } else {
        await fetchJson(`/api/favorites?member=${encodeURIComponent(member)}&msg_id=${id}`, { method: "DELETE" });
        this.ids.delete(id);
      }
      if (btnEl) this.applyBtnState(btnEl, nowFav);
    } catch (e) {
      console.error(e);
      toast("お気に入りの更新に失敗しました: " + e.message, true);
    }
  },

  applyBtnState(btnEl, isFav) {
    btnEl.classList.toggle("is-favorited", isFav);
    btnEl.textContent = isFav ? "★" : "☆"; // ★ / ☆
    btnEl.title = isFav ? "お気に入り解除" : "お気に入りに追加";
  },
};

// mediaElに音声トラックがあるかを判定する。
// HTMLMediaElement標準には「音声トラックの有無」を直接返すプロパティが
// 無く、ブラウザ実装依存のAPIを試すしかない:
//   - webkitAudioDecodedByteCount (Chrome/Safari系): デコード済み音声バイト数。
//     音声トラックが無ければ再生が進んでも常に0のまま。
//   - mozHasAudio (Firefox)
//   - audioTracks (実装されていれば長さで判定、非対応ブラウザではundefined)
// いずれも読み込み前(readyState不足)は未確定なため、判定できない場合は
// nullを返し、呼び出し側は「わかるまでは活性のまま」にする
// (誤って音声ありの動画を非活性にしてしまう方が実害が大きいため)。
function detectHasAudio(mediaEl) {
  if (typeof mediaEl.audioTracks !== "undefined") {
    return mediaEl.audioTracks.length > 0;
  }
  if (typeof mediaEl.webkitAudioDecodedByteCount !== "undefined") {
    if (mediaEl.webkitAudioDecodedByteCount > 0) return true;
    // 0はまだデコードが進んでいないだけの可能性があるため、readyState を見て
    // ある程度再生データが読めている場合のみ「音声なし」と確定させる。
    if (mediaEl.readyState >= 2) return false; // HAVE_CURRENT_DATA以上
    return null;
  }
  if (typeof mediaEl.mozHasAudio !== "undefined") {
    return mediaEl.mozHasAudio;
  }
  return null;
}

// 動画/音声要素に付随する音量ブースト(0〜200%)スライダーを組み立てる。
// ネイティブcontrolsの音量(0〜100%)とは別に、100%超はVolumeBoost経由の
// GainNodeで増幅する。要素クリック時のイベント伝播でプレイヤー操作と
// 干渉しないよう、スライダー自体はcontrols領域の外(wrap内の別行)に置く。
// 音声トラックの無い動画(無音動画)ではスライダーを非活性にする。
function buildVolumeBoostControl(mediaEl) {
  const row = ce("div", "volume-boost-row");

  const label = ce("span", "volume-boost-label");
  label.textContent = "音量";
  row.appendChild(label);

  const slider = ce("input", "volume-boost-slider");
  slider.type = "range";
  slider.min = "0";
  slider.max = "200";
  slider.step = "5";
  slider.value = "100";
  row.appendChild(slider);

  const valueEl = ce("span", "volume-boost-value");
  valueEl.textContent = "100%";
  row.appendChild(valueEl);

  const applyFromSlider = () => {
    const pct = Number(slider.value);
    valueEl.textContent = `${pct}%`;
    VolumeBoost.apply(mediaEl, pct);
  };
  // input: ドラッグ中も随時反映。mousedown等のクリックがプレイヤーの
  // 再生/一時停止トグルに伝播しないよう、スライダー操作はここで完結させる。
  slider.addEventListener("input", applyFromSlider);
  slider.addEventListener("click", (e) => e.stopPropagation());

  // 音声トラックの有無はメタデータ/再生データが読み込まれるまで判定できない
  // ため、loadedmetadataとloadeddataの両方で判定を試み、結果が確定した
  // (true/falseのどちらかになった)時点で両方のリスナーを外す。
  const tryDetect = () => {
    const hasAudio = detectHasAudio(mediaEl);
    if (hasAudio === null) return;
    if (hasAudio === false) {
      slider.disabled = true;
      valueEl.textContent = "音声なし";
      row.classList.add("volume-boost-row--disabled");
    }
    mediaEl.removeEventListener("loadedmetadata", tryDetect);
    mediaEl.removeEventListener("loadeddata", tryDetect);
  };
  mediaEl.addEventListener("loadedmetadata", tryDetect);
  mediaEl.addEventListener("loadeddata", tryDetect);

  return row;
}

function buildMediaEl(msg) {
  const wrap = ce("div", "msg-media");

  if (msg.missing) {
    wrap.classList.add("missing-media-wrap");
    const ph = ce("div", "missing-media");
    ph.innerHTML = `&#9888;&#65039;<br>ファイルが見つかりません`;
    wrap.appendChild(ph);
    return wrap;
  }

  if (msg.kind === "image") {
    const img = ce("img", "thumb-img");
    img.alt = "画像";
    img.loading = "lazy";
    if (msg.thumb_url) {
      img.setAttribute("data-src", msg.thumb_url);
      LazyMedia.observe(img);
    } else if (msg.media_url) {
      img.setAttribute("data-src", msg.media_url);
      LazyMedia.observe(img);
    }
    img.addEventListener("click", () => openLightbox(msg));
    wrap.appendChild(img);
    return wrap;
  }

  if (msg.kind === "video") {
    const video = ce("video");
    video.controls = true;
    video.preload = "none";
    if (msg.thumb_url) {
      video.poster = msg.thumb_url;
      // video要素自体はposter画像の読み込み完了を通知するイベントを
      // 持たないため、同じURLをImageでプリロードしてloadを検知する。
      // 末尾表示中にposter読み込みでレイアウトシフトが起きても
      // 最下部に追従できるようにする(scrollToMsgId側の同様の補正と対)。
      const preloadImg = new Image();
      preloadImg.addEventListener("load", () => Timeline.stickToBottomIfNeeded(), { once: true });
      preloadImg.src = msg.thumb_url;
    }
    if (msg.media_url) {
      video.setAttribute("data-src", msg.media_url);
      video.setAttribute("data-type", "video/mp4");
      LazyMedia.observe(video);
    }
    wrap.appendChild(video);
    const badge = ce("div", "play-badge");
    badge.innerHTML = "&#9654;";
    // プレイヤーの操作を邪魔しないよう、再生開始で非表示にする
    video.addEventListener("play", () => badge.remove());
    wrap.appendChild(badge);
    wrap.appendChild(buildVolumeBoostControl(video));
    return wrap;
  }

  if (msg.kind === "audio") {
    // 拡張子が.mp4のため <video> で再生する
    const video = ce("video");
    video.controls = true;
    video.preload = "none";
    if (msg.media_url) {
      video.setAttribute("data-src", msg.media_url);
      video.setAttribute("data-type", "video/mp4");
      LazyMedia.observe(video);
    }
    wrap.appendChild(video);
    const tag = ce("div", "audio-tag");
    tag.innerHTML = "&#127925; 音声";
    wrap.appendChild(tag);
    wrap.appendChild(buildVolumeBoostControl(video));
    return wrap;
  }

  return null; // text のみ: メディアなし
}

function buildMessageRow(msg) {
  const row = ce("div", "msg-row");
  row.dataset.msgId = msg.msg_id;
  row.dataset.ts = msg.ts;

  const bubble = ce("div", "msg-bubble");

  if (msg.missing) {
    const flag = ce("div", "missing-flag");
    flag.textContent = "⚠️ 欠損（実ファイルなし）";
    bubble.appendChild(flag);
  }

  if (msg.kind !== "text") {
    const mediaEl = buildMediaEl(msg);
    if (mediaEl) bubble.appendChild(mediaEl);
  }

  if (msg.body) {
    const bodyEl = ce("div", "msg-body");
    bodyEl.dataset.rawBody = msg.body;
    bodyEl.textContent = applyNicknamePlaceholder(msg.body);
    bubble.appendChild(bodyEl);
  } else if (msg.kind === "text" && !msg.missing) {
    const bodyEl = ce("div", "msg-body");
    bodyEl.textContent = "(本文なし)";
    bodyEl.style.opacity = "0.5";
    bubble.appendChild(bodyEl);
  }

  // バブルとアクション群(★/コピー)を横並びにするラッパー。
  // バブルのすぐ右にボタンが来るようにし、かつバブルの折り返し幅は崩さない。
  const bubbleRow = ce("div", "msg-bubble-row");
  bubbleRow.appendChild(bubble);
  bubbleRow.appendChild(buildMsgRowActions(msg));
  row.appendChild(bubbleRow);

  const timeEl = ce("div", "msg-time");
  timeEl.textContent = formatTime(msg.ts);
  row.appendChild(timeEl);

  return row;
}

// ★お気に入りボタン・パスコピーボタンをまとめたアクション群。
// .msg-bubble-row内でバブルの隣に置かれ、ホバー時のみ表示される。
function buildMsgRowActions(msg) {
  const actions = ce("div", "msg-row-actions");

  const favBtn = ce("button", "msg-action-btn fav-btn");
  favBtn.type = "button";
  const isFav = Favorites.has(msg.msg_id);
  Favorites.applyBtnState(favBtn, isFav);
  if (isFav) actions.classList.add("has-favorite"); // お気に入り済みは常時点灯させる
  favBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    await Favorites.toggle(msg.member, msg.msg_id, favBtn);
    actions.classList.toggle("has-favorite", Favorites.has(msg.msg_id));
  });
  actions.appendChild(favBtn);

  if (msg.kind !== "text") {
    const copyBtn = ce("button", "msg-action-btn copy-path-btn");
    copyBtn.type = "button";
    copyBtn.title = "メディアのパスをコピー";
    copyBtn.textContent = "⧉";
    copyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      copyMediaPath(msg.member, msg.msg_id);
    });
    actions.appendChild(copyBtn);
  }

  return actions;
}

// クリップボードへのコピー。navigator.clipboardはHTTPS/localhost限定のため、
// LAN IP等の平文http経由アクセス時はexecCommandへフォールバックする。
async function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      console.error(e);
    }
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-9999px";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    if (ok) return true;
  } catch (e) {
    console.error(e);
  }
  return false;
}

async function copyMediaPath(member, msgId) {
  try {
    const data = await fetchJson(`/api/media-path?member=${encodeURIComponent(member)}&msg_id=${msgId}`);
    const ok = await copyTextToClipboard(data.path);
    if (ok) {
      toast(data.exists ? "パスをコピーしました" : "パスをコピーしました（ファイルは見つかりません）", !data.exists);
    } else {
      // コピーにも失敗した場合は手動コピーできるようパスを直接見せる
      window.prompt("コピーに失敗しました。以下のパスを手動でコピーしてください:", data.path);
    }
  } catch (e) {
    console.error(e);
    toast("パスの取得に失敗しました: " + e.message, true);
  }
}

// ---------------------------------------------------------------------------
// タイムライン (仮想スクロール)
// ---------------------------------------------------------------------------
const Timeline = {
  member: null,
  loadingOlder: false,
  loadingNewer: false,
  hasMoreOlder: true,
  hasMoreNewer: true,
  PAGE_SIZE: 50,
  MAX_DOM_ROWS: 400,   // これを超えたら反対側を間引く
  TRIM_TO: 250,

  el: null,

  init() {
    this.el = qs("#timeline");
    this.el.addEventListener("scroll", () => this.onScroll(), { passive: true });
    qs("#scrollBottomBtn").addEventListener("click", () => this.scrollToBottomAndResync());
    // 画像/動画poster等、個別のloadイベントを待つ経路(stickToBottomIfNeeded
    // の各呼び出し箇所)だけでは、IntersectionObserverの初回発火タイミングが
    // 遅れるケース等で取りこぼしうる(初回表示時のみ最下部までスクロール
    // されないことがあった)。保険として#timelineの最後の子要素(末尾行)の
    // サイズ変化を監視し、確実に追従する
    // (_updateBottomResizeObserverでappendBatch時に監視対象を切り替える)。
    this._bottomRo = new ResizeObserver(() => this.stickToBottomIfNeeded());
  },

  // #timelineの最後の子要素(末尾行)を監視対象に切り替える。appendBatchで
  // 末尾に新しい行を足すたびに呼ぶことで、直近の末尾行のサイズ変化
  // (画像/動画読み込みによる高さ確定)を検知して最下部への追従に使う。
  _updateBottomResizeObserver() {
    this._bottomRo.disconnect();
    const last = this.el.lastElementChild;
    if (last) this._bottomRo.observe(last);
  },

  // フローティング日付見出し(#stickyDateSep)の更新。
  // 全.date-sepを毎回走査すると行数が多い場合に重くなるため、
  // スクロールコンテナ上端直下の要素をelementFromPointで1件だけ拾い、
  // そこから遡って直近の.msg-row(の日付)ないし.date-sepを求める軽量な方法にする。
  updateStickyDateSep() {
    const el = this.el;
    const stickyEl = qs("#stickyDateSep");
    if (!this.member || el.children.length === 0) {
      stickyEl.classList.add("hidden");
      return;
    }
    const rect = el.getBoundingClientRect();
    // コンテナ上端よりわずかに内側の点で判定(境界ちょうどだと取得できないブラウザ対策)
    const probeY = rect.top + 2;
    const probeX = rect.left + rect.width / 2;
    let target = document.elementFromPoint(probeX, probeY);
    // ヒットした要素から.msg-rowまたは.date-sepまで祖先を辿る
    let node = target;
    while (node && node !== el && !node.classList?.contains("msg-row") && !node.classList?.contains("date-sep")) {
      node = node.parentElement;
    }
    if (!node || node === el) {
      // 取得できなかった場合(スクロール最上部など)は先頭要素から求める
      node = el.firstElementChild;
    }
    let dateText = null;
    let sepNode = null;
    while (node) {
      if (node.classList && node.classList.contains("date-sep")) {
        dateText = node.textContent;
        sepNode = node;
        break;
      }
      if (node.classList && node.classList.contains("msg-row") && node.dataset.ts) {
        dateText = formatDateSep(Number(node.dataset.ts));
        // この.msg-row自体は.date-sepではないため、対応する実.date-sepを
        // さらに遡って探す(表示中の日付を示している要素そのもの)。
        let seekNode = node.previousElementSibling;
        while (seekNode) {
          if (seekNode.classList && seekNode.classList.contains("date-sep")) {
            sepNode = seekNode;
            break;
          }
          seekNode = seekNode.previousElementSibling;
        }
        break;
      }
      node = node.previousElementSibling;
    }
    // 対応する.date-sep要素自体が既にビューポート内に見えているなら、
    // 通常のセパレータと重複表示されてしまうためsticky側は非表示にする。
    // 見つからなかった場合は誤って重複表示するより非表示側に倒す。
    if (dateText && sepNode) {
      const sepRect = sepNode.getBoundingClientRect();
      const alreadyVisible = sepRect.bottom > rect.top;
      if (alreadyVisible) {
        stickyEl.classList.add("hidden");
      } else {
        stickyEl.textContent = dateText;
        stickyEl.classList.remove("hidden");
      }
    } else {
      stickyEl.classList.add("hidden");
    }
  },

  reapplyNicknamePlaceholder() {
    this.el.querySelectorAll(".msg-body[data-raw-body]").forEach((el) => {
      el.textContent = applyNicknamePlaceholder(el.dataset.rawBody);
    });
  },

  reset(member) {
    this.member = member;
    this.loadingOlder = false;
    this.loadingNewer = false;
    this.hasMoreOlder = true;
    this.hasMoreNewer = true;
    this.el.innerHTML = "";
    this._globalLastDateKey = null;
    this._stickToBottom = false;
    this._bottomRo.disconnect();
    qs("#emptyState").classList.add("hidden");
    this.el.classList.remove("hidden");
    qs("#stickyDateSep").classList.add("hidden");
  },

  // 末尾表示中に遅延読み込み画像が展開されても最下部に追従させる
  stickToBottomIfNeeded() {
    if (!this._stickToBottom) return;
    this.el.scrollTop = this.el.scrollHeight;
  },

  // jumpMsgId: ジャンプ先を一意に特定するmsg_id(あれば優先して使う)。
  // tsは「同じ秒」に複数メッセージが存在すると重複しうるため、ts一致だけで
  // ジャンプ先を探すと別のメッセージにマッチすることがある
  // (呼び出し元がmsg_idを持たない場合=カレンダーからのジャンプ等のみnull)。
  async loadInitial(member, jumpTs, jumpMsgId = null) {
    this.reset(member);
    this.el.innerHTML = `<div class="load-sentinel">読み込み中...</div>`;
    try {
      let data;
      if (jumpTs != null) {
        // ジャンプ先の少し前から読み込む
        data = await fetchJson(`/api/messages?member=${encodeURIComponent(member)}&before=${jumpTs + 1}&limit=${this.PAGE_SIZE}`);
      } else {
        data = await fetchJson(`/api/messages?member=${encodeURIComponent(member)}&limit=${this.PAGE_SIZE}`);
      }
      this.el.innerHTML = "";
      const msgs = data.messages || [];
      if (msgs.length === 0) {
        this.el.innerHTML = `<div class="load-sentinel">メッセージがありません</div>`;
        this.hasMoreOlder = false;
        this.hasMoreNewer = false;
        return;
      }
      if (msgs.length < this.PAGE_SIZE) {
        this.hasMoreOlder = false;
      }
      this.appendBatch(msgs, "bottom");

      if (jumpTs != null) {
        // ジャンプ指定がある場合、以降のメッセージも少し読み込んでおく
        const newer = await fetchJson(`/api/messages?member=${encodeURIComponent(member)}&after=${msgs[msgs.length - 1].ts}&limit=${this.PAGE_SIZE}`);
        if (newer.messages && newer.messages.length > 0) {
          this.appendBatch(newer.messages, "bottom");
          if (newer.messages.length < this.PAGE_SIZE) this.hasMoreNewer = false;
        } else {
          this.hasMoreNewer = false;
        }
        // ジャンプ先の行までスクロール。msg_idが分かっていればそれで一意に
        // 特定する(before=jumpTs+1で取得したバッチの末尾がjumpTsのメッセージ
        // だが、同じ秒に複数メッセージがある場合はts一致だけでは別の
        // メッセージにマッチしうるため)。
        const byId = jumpMsgId != null ? msgs.find((m) => m.msg_id === jumpMsgId) : null;
        const byTs = !byId ? msgs.find((m) => m.ts === jumpTs) : null;
        const jumpMsg = byId || byTs || msgs[msgs.length - 1];
        if (isDevMode) {
          console.info("[Timeline.loadInitial] jump debug", {
            requestedJumpTs: jumpTs,
            requestedJumpMsgId: jumpMsgId,
            matchedBy: byId ? "msg_id" : (byTs ? "ts" : "fallback-last"),
            resolvedMsgId: jumpMsg.msg_id,
            resolvedTs: jumpMsg.ts,
            msgsCount: msgs.length,
            msgsTsRange: [msgs[0]?.ts, msgs[msgs.length - 1]?.ts],
          });
        }
        requestAnimationFrame(() => this.scrollToMsgId(jumpMsg.msg_id));
      } else {
        this.hasMoreNewer = false; // 最新から読んでいるので「新しい方向」はもうない
        this._stickToBottom = true;
        requestAnimationFrame(() => { this.el.scrollTop = this.el.scrollHeight; });
      }
      requestAnimationFrame(() => this.updateStickyDateSep());
    } catch (e) {
      console.error(e);
      this.el.innerHTML = `<div class="load-sentinel">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },

  scrollToMsgId(msgId) {
    const row = this.el.querySelector(`.msg-row[data-msg-id="${CSS.escape(String(msgId))}"]`);
    if (!row) return;
    row.scrollIntoView({ block: "center" });
    const bubble = row.querySelector(".msg-bubble");
    if (bubble) {
      bubble.style.transition = "box-shadow 0.6s";
      const orig = bubble.style.boxShadow;
      bubble.style.boxShadow = "0 0 0 2px var(--selected-border)";
      setTimeout(() => { bubble.style.boxShadow = orig; }, 1200);
    }
    // 画像サムネやvideoのposter画像は非同期で読み込まれるため、
    // scrollIntoView実行時点ではまだ高さが確定しておらず、その後の
    // 読み込み完了でレイアウトシフトが起き、対象行が画面外に押し出される
    // ことがある。読み込み完了(またはタイムアウト)を待って再度centerへ
    // スクロールし直すことで、この分の位置ズレを補正する。
    const resync = () => row.scrollIntoView({ block: "center" });
    const img = row.querySelector("img");
    if (img && !img.complete) {
      img.addEventListener("load", resync, { once: true });
    }
    const video = row.querySelector("video");
    if (video) {
      const posterUrl = video.getAttribute("poster");
      if (posterUrl) {
        // video要素自体はposter画像の読み込み完了を通知するイベントを
        // 持たないため、同じURLをImageでプリロードしてloadを検知する。
        const preloadImg = new Image();
        preloadImg.addEventListener("load", resync, { once: true });
        preloadImg.src = posterUrl;
      }
      // preload="none"のためLazyMediaが実データを読み込むまでmetadataも
      // 取得できない。画面内に入って読み込みが進んだ場合の保険。
      video.addEventListener("loadedmetadata", resync, { once: true });
    }
    // 上記いずれのイベントも発火しなかった場合の最終保険。
    setTimeout(resync, 300);
  },

  // batch: 昇順(古い→新しい)の配列を想定
  appendBatch(msgs, where) {
    const frag = document.createDocumentFragment();
    for (const msg of msgs) {
      const dk = dateKey(msg.ts);
      if (dk !== this._globalLastDateKey) {
        frag.appendChild(buildDateSep(msg.ts));
      }
      frag.appendChild(buildMessageRow(msg));
      this._globalLastDateKey = dk;
    }
    if (where === "bottom") {
      this.el.appendChild(frag);
      this._updateBottomResizeObserver();
    } else {
      this.el.insertBefore(frag, this.el.firstChild);
    }
  },

  onScroll() {
    const el = this.el;
    if (el.scrollTop < 400 && this.hasMoreOlder && !this.loadingOlder) {
      this.loadOlder();
    }
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 400 && this.hasMoreNewer && !this.loadingNewer) {
      this.loadNewer();
    }
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 200;
    qs("#scrollBottomBtn").classList.toggle("hidden", nearBottom);
    this._stickToBottom = nearBottom;

    // スクロールが止まっている間は更新不要なので、rAFで1フレームあたり1回に間引く
    if (!this._stickyRafPending) {
      this._stickyRafPending = true;
      requestAnimationFrame(() => {
        this._stickyRafPending = false;
        this.updateStickyDateSep();
      });
    }
  },

  async loadOlder() {
    const firstRow = this.el.querySelector(".msg-row");
    if (!firstRow) return;
    const oldestTs = Number(firstRow.dataset.ts);
    this.loadingOlder = true;
    const sentinel = ce("div", "load-sentinel");
    sentinel.textContent = "過去のメッセージを読み込み中...";
    this.el.insertBefore(sentinel, this.el.firstChild);
    try {
      const data = await fetchJson(`/api/messages?member=${encodeURIComponent(this.member)}&before=${oldestTs}&limit=${this.PAGE_SIZE}`);
      const msgs = data.messages || [];
      sentinel.remove();
      if (msgs.length === 0) {
        this.hasMoreOlder = false;
        return;
      }
      if (msgs.length < this.PAGE_SIZE) this.hasMoreOlder = false;

      // スクロール位置補正: 挿入前の scrollHeight を記録
      const prevScrollHeight = this.el.scrollHeight;
      const prevScrollTop = this.el.scrollTop;

      // 日付セパレータ再計算のため、先頭要素の日付を一旦リセットして挿入
      this._globalLastDateKey = null;
      this.appendBatch(msgs, "top");
      // 直後に続く要素との重複日付セパレータを除去
      this._dedupeDateSeps();

      const newScrollHeight = this.el.scrollHeight;
      this.el.scrollTop = prevScrollTop + (newScrollHeight - prevScrollHeight);

      this.trimIfNeeded("bottom");
    } catch (e) {
      console.error(e);
      sentinel.textContent = "読み込みに失敗しました";
      setTimeout(() => sentinel.remove(), 2000);
    } finally {
      this.loadingOlder = false;
    }
  },

  async loadNewer() {
    const rows = this.el.querySelectorAll(".msg-row");
    if (rows.length === 0) return;
    const lastRow = rows[rows.length - 1];
    const newestTs = Number(lastRow.dataset.ts);
    this.loadingNewer = true;
    try {
      const data = await fetchJson(`/api/messages?member=${encodeURIComponent(this.member)}&after=${newestTs}&limit=${this.PAGE_SIZE}`);
      const msgs = data.messages || [];
      if (msgs.length === 0) {
        this.hasMoreNewer = false;
        return;
      }
      if (msgs.length < this.PAGE_SIZE) this.hasMoreNewer = false;
      // appendBatch は this._globalLastDateKey (タイムライン末尾の日付) を使うので、
      // 末尾に追記する場合はリセット不要(そのまま続きとして比較される)
      const lastKey = dateKey(Number(lastRow.dataset.ts));
      this._globalLastDateKey = lastKey;
      this.appendBatch(msgs, "bottom");
      this.trimIfNeeded("top");
    } catch (e) {
      console.error(e);
    } finally {
      this.loadingNewer = false;
    }
  },

  // 取り込み中の自動追従用: ユーザーが末尾付近を見ていて、かつ既に最新まで
  // 読み込み済み(hasMoreNewer=false)の場合だけ新着メッセージを取り込む。
  // 過去ログを閲覧中(末尾から離れている)のユーザーの位置を勝手に動かさないため、
  // 条件を満たさない場合は何もしない(通常のloadNewerページングと競合しないよう
  // loadingNewer中もスキップする)。
  async refreshIfAtBottom() {
    if (!this.member || !this._stickToBottom || this.hasMoreNewer || this.loadingNewer) return;
    const rows = this.el.querySelectorAll(".msg-row");
    if (rows.length === 0) return;
    await this.loadNewer();
    requestAnimationFrame(() => { this.el.scrollTop = this.el.scrollHeight; });
  },

  _dedupeDateSeps() {
    // 連続する date-sep のうち2つ目以降を削除
    const children = Array.from(this.el.children);
    let prevWasSep = false;
    for (const child of children) {
      const isSep = child.classList.contains("date-sep");
      if (isSep && prevWasSep) {
        child.remove();
      }
      prevWasSep = isSep;
    }
    // 同一日付が連続するセパレータも統合(念のため二重チェック)
    const seps = Array.from(this.el.querySelectorAll(".date-sep"));
    for (let i = 1; i < seps.length; i++) {
      if (seps[i].textContent === seps[i - 1].textContent) {
        let node = seps[i - 1].nextSibling;
        let hasMsgBetween = false;
        while (node && node !== seps[i]) {
          if (node.classList && node.classList.contains("msg-row")) hasMsgBetween = true;
          node = node.nextSibling;
        }
        if (!hasMsgBetween) seps[i].remove();
      }
    }
  },

  trimIfNeeded(side) {
    const rows = this.el.querySelectorAll(".msg-row");
    if (rows.length <= this.MAX_DOM_ROWS) return;
    const excess = rows.length - this.TRIM_TO;
    if (excess <= 0) return;

    if (side === "bottom") {
      // 下端(新しい方)を間引く。ユーザーが下端付近を見ている場合は間引かない。
      const el = this.el;
      const distFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
      if (distFromBottom < 800) return;
      let node = el.lastElementChild;
      const toRemove = [];
      let rowCount = 0;
      while (node && rowCount < excess) {
        toRemove.push(node);
        if (node.classList.contains("msg-row")) rowCount++;
        node = node.previousElementSibling;
      }
      for (const n of toRemove) n.remove();
      this.hasMoreNewer = true;
    } else {
      // 上端(古い方)を間引く。ユーザーが上端付近を見ている場合は間引かない。
      const el = this.el;
      if (el.scrollTop < 800) return;
      const prevScrollHeight = el.scrollHeight;
      const prevScrollTop = el.scrollTop;

      let node = el.firstElementChild;
      const toRemove = [];
      let rowCount = 0;
      while (node && rowCount < excess) {
        toRemove.push(node);
        if (node.classList.contains("msg-row")) rowCount++;
        node = node.nextElementSibling;
      }
      for (const n of toRemove) n.remove();
      this.hasMoreOlder = true;

      const newScrollHeight = el.scrollHeight;
      el.scrollTop = prevScrollTop - (prevScrollHeight - newScrollHeight);
    }
  },

  scrollToBottomAndResync() {
    if (this.member) {
      this.loadInitial(this.member, null);
    }
  },
};

const KANJI_DIGITS = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9, "十": 10 };

// グループ名から"◯期生"の期生番号を抽出する。漢数字(一〜十)・算用数字の両方に対応。
// 該当パターンが無ければnullを返す。
function extractGeneration(groupName) {
  const arabicMatch = groupName.match(/(\d+)\s*期生/);
  if (arabicMatch) return Number(arabicMatch[1]);
  const kanjiMatch = groupName.match(/([一二三四五六七八九十])期生/);
  if (kanjiMatch) return KANJI_DIGITS[kanjiMatch[1]] ?? null;
  return null;
}

const Sidebar = {
  threads: [],
  selectedMember: null,

  async load({ silent = false } = {}) {
    if (!silent) qs("#memberListLoading").classList.remove("hidden");
    // 調査用: /api/threads の所要時間をコンソールで確認できるようにする
    // (取り込み中はSQLiteロック待ち等で遅くなりうるため)。
    const _t0 = performance.now();
    try {
      const data = await fetchJson("/api/threads");
      const _elapsed = performance.now() - _t0;
      if (isDevMode && _elapsed > 1000) {
        console.warn(`[Sidebar.load] /api/threads took ${Math.round(_elapsed)}ms (silent=${silent})`);
      }
      const next = data || [];
      // silent時(取り込み中のバックグラウンドポーリング)は、内容が前回と同じなら
      // render()を呼ばない。renderは一覧DOMを丸ごと作り直すため、変化が無いのに
      // 毎回呼ぶとちらつきやスクロール位置のリセットにつながるため。
      if (silent && this._sameThreads(next)) {
        if (isDevMode) {
          console.debug(`[Sidebar.load] silent poll: server returned ${next.length} threads (unchanged)`);
        }
        return;
      }
      if (silent && isDevMode) {
        console.info(`[Sidebar.load] silent poll: threads ${this.threads.length} -> ${next.length}`);
      }
      this.threads = next;
      this.render();
    } catch (e) {
      console.error(e);
      if (silent) return; // バックグラウンド更新の失敗は静かに無視する
      qs("#memberListLoading").textContent = "読み込みに失敗しました";
      toast("メンバー一覧の取得に失敗しました: " + e.message, true);
      return;
    }
    if (!silent) qs("#memberListLoading").classList.add("hidden");
  },

  _sameThreads(next) {
    if (next.length !== this.threads.length) return false;
    for (let i = 0; i < next.length; i++) {
      const a = this.threads[i], b = next[i];
      if (a.member !== b.member || a.group !== b.group || a.count !== b.count || a.last_ts !== b.last_ts) {
        return false;
      }
    }
    return true;
  },

  render() {
    const el = qs("#memberList");
    el.innerHTML = "";

    const groups = new Map(); // groupName -> [thread]
    const OTHER = "その他";
    for (const t of this.threads) {
      const g = t.group || OTHER;
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(t);
    }

    // グループ名でソート(「その他」は最後)、"◯期生"を含む場合は期生番号の昇順、
    // それ以外は文字列比較にフォールバックする。
    const groupNames = Array.from(groups.keys()).sort((a, b) => {
      if (a === OTHER) return 1;
      if (b === OTHER) return -1;
      const genA = extractGeneration(a);
      const genB = extractGeneration(b);
      if (genA !== null && genB !== null) return genA - genB;
      if (genA !== null) return -1;
      if (genB !== null) return 1;
      return a.localeCompare(b, "ja");
    });

    for (const g of groupNames) {
      const heading = ce("div", "group-heading");
      heading.textContent = g;
      el.appendChild(heading);

      const members = groups.get(g).sort((a, b) => (b.last_ts || 0) - (a.last_ts || 0));
      for (const t of members) {
        el.appendChild(this.buildMemberItem(t));
      }
    }

    if (this.threads.length === 0) {
      const hint = ce("div", "hint");
      hint.textContent = "メンバーがいません（インデックス未実行、または実行中）";
      el.appendChild(hint);
    }
  },

  buildMemberItem(t) {
    const item = ce("div", "member-item");
    item.dataset.member = t.member;
    if (t.member === this.selectedMember) item.classList.add("selected");

    const avatar = ce("div", "member-avatar");
    avatar.textContent = (t.member || "?").slice(0, 1);

    const meta = ce("div", "member-meta");
    const name = ce("div", "member-name");
    name.textContent = t.member;
    const sub = ce("div", "member-sub");
    const count = ce("span");
    count.textContent = `${t.count}件`;
    const last = ce("span");
    last.textContent = t.last_ts ? formatLastTs(t.last_ts) : "-";
    sub.appendChild(count);
    sub.appendChild(last);

    meta.appendChild(name);
    meta.appendChild(sub);
    item.appendChild(avatar);
    item.appendChild(meta);

    item.addEventListener("click", () => App.selectMember(t.member));
    return item;
  },

  setSelected(member) {
    this.selectedMember = member;
    qs("#memberList").querySelectorAll(".member-item").forEach((el) => {
      el.classList.toggle("selected", el.dataset.member === member);
    });
  },
};

function formatLastTs(ts) {
  const p = jstDateParts(ts);
  return `${p.y}/${String(p.m).padStart(2, "0")}/${String(p.day).padStart(2, "0")}`;
}

const Search = {
  init() {
    qs("#searchBtn").addEventListener("click", () => this.run());
    qs("#searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") this.run();
    });
    qs(".search-close").addEventListener("click", () => this.close());
  },

  async run() {
    const q = qs("#searchInput").value.trim();
    if (!q) return;
    if (q.length < 3) {
      toast("3文字未満の場合は簡易検索(LIKE)になります。全文検索(FTS)には3文字以上入力してください。");
    }
    const scopeAll = qs("#searchScopeAll").checked;
    const member = scopeAll ? null : Sidebar.selectedMember;
    if (!scopeAll && !member) {
      toast("検索対象のメンバーが選択されていません。先にメンバーを選択するか「全メンバー」にチェックしてください。", true);
      return;
    }
    const from = qs("#searchFrom").value;
    const to = qs("#searchTo").value;

    const params = new URLSearchParams();
    params.set("q", q);
    if (member) params.set("member", member);
    if (from) params.set("from", from);
    if (to) params.set("to", to);
    params.set("limit", "100");

    const panel = qs("#searchPanel");
    const body = qs("#searchResultBody");
    panel.classList.remove("hidden");
    qs("#calendarPanel").classList.add("hidden");
    qs("#favoritesPanel").classList.add("hidden");
    qs("#galleryPanel").classList.add("hidden");
    body.innerHTML = `<div class="hint">検索中...</div>`;

    try {
      const data = await fetchJson(`/api/search?${params.toString()}`);
      qs("#searchResultTitle").textContent = `検索結果 (${data.results.length}件${data.used_fts ? "" : " / 簡易検索"})`;
      body.innerHTML = "";
      if (data.results.length === 0) {
        body.innerHTML = `<div class="hint">該当する結果がありません</div>`;
        return;
      }
      for (const r of data.results) {
        body.appendChild(this.buildResultItem(r));
      }
    } catch (e) {
      console.error(e);
      body.innerHTML = `<div class="hint">検索に失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },

  buildResultItem(r) {
    const item = ce("div", "search-result-item");
    const meta = ce("div", "sr-meta");
    meta.innerHTML = `<b>${escapeHtml(r.member)}</b><span>${escapeHtml(formatLastTs(r.ts))} ${formatTime(r.ts)}</span>`;
    const snippet = ce("div", "sr-snippet");
    // snippet には <mark> タグが含まれる想定。それ以外はエスケープしたいが、
    // サーバ側が snippet() / body そのまま を返すため、mark 以外のHTML注入を防ぐ簡易サニタイズを行う。
    snippet.innerHTML = sanitizeSnippet(applyNicknamePlaceholder(r.snippet || ""));
    item.appendChild(meta);
    item.appendChild(snippet);
    item.addEventListener("click", () => {
      this.close();
      App.jumpToMessage(r.member, r.ts, r.msg_id);
    });
    return item;
  },

  close() {
    qs("#searchPanel").classList.add("hidden");
  },
};

function sanitizeSnippet(raw) {
  // <mark>...</mark> のみ許可し、それ以外の < > はエスケープする
  const placeholder1 = " MARK_OPEN ";
  const placeholder2 = " MARK_CLOSE ";
  let s = raw.split("<mark>").join(placeholder1).split("</mark>").join(placeholder2);
  s = escapeHtml(s);
  s = s.split(placeholder1).join("<mark>").split(placeholder2).join("</mark>");
  return s;
}

// カレンダー (日付ジャンプ)
// ---------------------------------------------------------------------------
const CalendarPanel = {
  init() {
    qs("#calendarBtn").addEventListener("click", () => this.toggle());
    qs(".calendar-close").addEventListener("click", () => this.close());
    qs("#calendarBackBtn").addEventListener("click", () => this.renderMonths());
  },

  toggle() {
    const panel = qs("#calendarPanel");
    if (panel.classList.contains("hidden")) {
      this.open();
    } else {
      this.close();
    }
  },

  close() {
    qs("#calendarPanel").classList.add("hidden");
  },

  async open() {
    if (!Sidebar.selectedMember) {
      toast("先にメンバーを選択してください", true);
      return;
    }
    qs("#searchPanel").classList.add("hidden");
    qs("#favoritesPanel").classList.add("hidden");
    qs("#galleryPanel").classList.add("hidden");
    qs("#calendarPanel").classList.remove("hidden");
    await this.renderMonths();
  },

  async renderMonths() {
    qs("#calendarBackBtn").classList.add("hidden");
    qs("#calendarTitle").textContent = "日付ジャンプ";
    const body = qs("#calendarBody");
    body.innerHTML = `<div class="hint">読み込み中...</div>`;
    try {
      const data = await fetchJson(`/api/calendar?member=${encodeURIComponent(Sidebar.selectedMember)}`);
      body.innerHTML = "";
      const byYear = new Map();
      for (const c of data.calendar) {
        const [y, m] = c.yearmonth.split("-");
        if (!byYear.has(y)) byYear.set(y, []);
        byYear.get(y).push({ month: m, count: c.count });
      }
      const years = Array.from(byYear.keys()).sort().reverse();
      if (years.length === 0) {
        body.innerHTML = `<div class="hint">データがありません</div>`;
        return;
      }
      for (const y of years) {
        const heading = ce("div", "calendar-year");
        heading.textContent = `${y}年`;
        body.appendChild(heading);
        const grid = ce("div", "calendar-grid");
        const months = byYear.get(y).slice().reverse();
        for (const { month, count } of months) {
          const cell = ce("div", "calendar-month");
          cell.innerHTML = `<div class="cm-label">${Number(month)}月</div><div class="cm-count">${count}件</div>`;
          cell.addEventListener("click", () => this.renderDays(y, month));
          grid.appendChild(cell);
        }
        body.appendChild(grid);
      }
    } catch (e) {
      console.error(e);
      body.innerHTML = `<div class="hint">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },

  async renderDays(year, month) {
    const yearmonth = `${year}-${month}`;
    qs("#calendarBackBtn").classList.remove("hidden");
    qs("#calendarTitle").textContent = `${year}年${Number(month)}月`;
    const body = qs("#calendarBody");
    body.innerHTML = `<div class="hint">読み込み中...</div>`;
    try {
      const data = await fetchJson(
        `/api/calendar?member=${encodeURIComponent(Sidebar.selectedMember)}&yearmonth=${yearmonth}`
      );
      const countByDay = new Map();
      for (const d of data.days) {
        const day = Number(d.date.split("-")[2]);
        countByDay.set(day, d.count);
      }

      body.innerHTML = "";
      const weekdaysRow = ce("div", "calendar-weekdays");
      for (const w of ["日", "月", "火", "水", "木", "金", "土"]) {
        const span = document.createElement("span");
        span.textContent = w;
        weekdaysRow.appendChild(span);
      }
      body.appendChild(weekdaysRow);

      const firstOfMonth = new Date(Number(year), Number(month) - 1, 1);
      const daysInMonth = new Date(Number(year), Number(month), 0).getDate();
      const startWeekday = firstOfMonth.getDay();

      const grid = ce("div", "calendar-daygrid");
      for (let i = 0; i < startWeekday; i++) {
        grid.appendChild(ce("div", "calendar-day empty"));
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const count = countByDay.get(day);
        const cell = ce("div", `calendar-day ${count ? "has-messages" : "no-messages"}`);
        cell.textContent = day;
        if (count) {
          cell.title = `${count}件`;
          const dateStr = `${year}-${month}-${String(day).padStart(2, "0")}`;
          cell.addEventListener("click", () => {
            this.close();
            App.jumpToDate(Sidebar.selectedMember, dateStr);
          });
        }
        grid.appendChild(cell);
      }
      body.appendChild(grid);
    } catch (e) {
      console.error(e);
      body.innerHTML = `<div class="hint">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },
};

const FavoritesPanel = {
  loading: false,
  hasMore: true,
  oldestCreatedAt: null,
  PAGE_SIZE: 50,

  init() {
    qs("#favoritesBtn").addEventListener("click", () => this.toggle());
    qs(".favorites-close").addEventListener("click", () => this.close());
    qs("#favoritesBody").addEventListener("scroll", () => this.onScroll());
  },

  toggle() {
    const panel = qs("#favoritesPanel");
    if (panel.classList.contains("hidden")) {
      this.open();
    } else {
      this.close();
    }
  },

  async open() {
    // ギャラリーと同様、選択中メンバーが無いと何を表示すべきか決まらないため開かない
    if (!Sidebar.selectedMember) {
      toast("先にメンバーを選択してください", true);
      return;
    }
    // 他パネルと同時に開かない
    qs("#searchPanel").classList.add("hidden");
    qs("#calendarPanel").classList.add("hidden");
    qs("#galleryPanel").classList.add("hidden");
    qs("#favoritesPanel").classList.remove("hidden");
    qs("#favoritesTitle").textContent = `お気に入り — ${Sidebar.selectedMember}`;
    await this.reload();
  },

  close() {
    qs("#favoritesPanel").classList.add("hidden");
  },

  async reload() {
    this.hasMore = true;
    this.oldestCreatedAt = null;
    const body = qs("#favoritesBody");
    body.innerHTML = `<div class="hint">読み込み中...</div>`;
    try {
      const data = await fetchJson(`/api/favorites?limit=${this.PAGE_SIZE}&member=${encodeURIComponent(Sidebar.selectedMember)}`);
      body.innerHTML = "";
      const favs = data.favorites || [];
      if (favs.length === 0) {
        body.innerHTML = `<div class="hint">このメンバーのお気に入りはまだありません</div>`;
        this.hasMore = false;
        return;
      }
      for (const f of favs) body.appendChild(this.buildItem(f));
      this.oldestCreatedAt = favs[favs.length - 1].created_at;
      if (favs.length < this.PAGE_SIZE) this.hasMore = false;
    } catch (e) {
      console.error(e);
      body.innerHTML = `<div class="hint">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },

  async loadMore() {
    if (this.loading || !this.hasMore || this.oldestCreatedAt == null) return;
    this.loading = true;
    try {
      const data = await fetchJson(`/api/favorites?limit=${this.PAGE_SIZE}&before=${this.oldestCreatedAt}&member=${encodeURIComponent(Sidebar.selectedMember)}`);
      const favs = data.favorites || [];
      if (favs.length === 0) {
        this.hasMore = false;
        return;
      }
      const body = qs("#favoritesBody");
      for (const f of favs) body.appendChild(this.buildItem(f));
      this.oldestCreatedAt = favs[favs.length - 1].created_at;
      if (favs.length < this.PAGE_SIZE) this.hasMore = false;
    } catch (e) {
      console.error(e);
    } finally {
      this.loading = false;
    }
  },

  onScroll() {
    const body = qs("#favoritesBody");
    if (body.scrollHeight - body.scrollTop - body.clientHeight < 200) {
      this.loadMore();
    }
  },

  buildItem(f) {
    const item = ce("div", "favorite-item");

    const thumbSrc = f.thumb_url || f.media_url;
    if (thumbSrc) {
      const img = ce("img", "favorite-thumb");
      img.loading = "lazy";
      img.src = thumbSrc;
      img.alt = "";
      item.appendChild(img);
    }

    const main = ce("div", "favorite-main");
    const meta = ce("div", "fav-meta");
    const memberEl = ce("b");
    memberEl.textContent = f.member;
    const timeEl = ce("span");
    timeEl.textContent = `${formatLastTs(f.ts)} ${formatTime(f.ts)}`;
    meta.appendChild(memberEl);
    meta.appendChild(timeEl);

    const snippet = ce("div", "fav-snippet");
    snippet.textContent = f.body ? applyNicknamePlaceholder(f.body) : (f.kind !== "text" ? `[${f.kind}]` : "");

    main.appendChild(meta);
    main.appendChild(snippet);
    item.appendChild(main);

    const unfavBtn = ce("button", "favorite-unfav-btn");
    unfavBtn.type = "button";
    unfavBtn.title = "お気に入り解除";
    unfavBtn.textContent = "★";
    unfavBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        await fetchJson(`/api/favorites?member=${encodeURIComponent(f.member)}&msg_id=${f.msg_id}`, { method: "DELETE" });
        Favorites.ids.delete(Number(f.msg_id));
        item.remove();
        // 現在表示中タイムラインに同じメッセージがあれば★表示も同期する
        const row = Timeline.el.querySelector(`.msg-row[data-msg-id="${CSS.escape(String(f.msg_id))}"]`);
        if (row) {
          const btn = row.querySelector(".fav-btn");
          if (btn) Favorites.applyBtnState(btn, false);
          const actions = row.querySelector(".msg-row-actions");
          if (actions) actions.classList.remove("has-favorite");
        }
      } catch (e2) {
        console.error(e2);
        toast("お気に入り解除に失敗しました: " + e2.message, true);
      }
    });
    item.appendChild(unfavBtn);

    item.addEventListener("click", () => {
      this.close();
      App.jumpToMessage(f.member, f.ts, f.msg_id);
    });

    return item;
  },
};

const GalleryPanel = {
  loading: false,
  hasMore: true,
  oldestTs: null,
  kind: "",   // "" = すべて
  PAGE_SIZE: 60,

  init() {
    qs("#galleryBtn").addEventListener("click", () => this.toggle());
    qs(".gallery-close").addEventListener("click", () => this.close());
    qs("#galleryBody").addEventListener("scroll", () => this.onScroll());
    for (const btn of document.querySelectorAll(".gallery-filter-btn")) {
      btn.addEventListener("click", () => this.setKind(btn.dataset.kind, btn));
    }
  },

  toggle() {
    const panel = qs("#galleryPanel");
    if (panel.classList.contains("hidden")) {
      this.open();
    } else {
      this.close();
    }
  },

  async open() {
    if (!Sidebar.selectedMember) {
      toast("先にメンバーを選択してください", true);
      return;
    }
    qs("#searchPanel").classList.add("hidden");
    qs("#calendarPanel").classList.add("hidden");
    qs("#favoritesPanel").classList.add("hidden");
    qs("#galleryPanel").classList.remove("hidden");
    await this.reload();
  },

  close() {
    qs("#galleryPanel").classList.add("hidden");
  },

  setKind(kind, btnEl) {
    if (this.kind === kind) return;
    this.kind = kind;
    document.querySelectorAll(".gallery-filter-btn").forEach((b) => b.classList.toggle("active", b === btnEl));
    this.reload();
  },

  async reload() {
    this.hasMore = true;
    this.oldestTs = null;
    const grid = qs("#galleryGrid");
    grid.innerHTML = `<div class="hint">読み込み中...</div>`;
    qs("#galleryLoadSentinel").classList.add("hidden");
    try {
      const items = await this.fetchPage();
      grid.innerHTML = "";
      if (items.length === 0) {
        grid.innerHTML = `<div class="hint">メディアがありません</div>`;
      } else {
        for (const item of items) grid.appendChild(this.buildItem(item));
      }
    } catch (e) {
      console.error(e);
      grid.innerHTML = `<div class="hint">読み込みに失敗しました: ${escapeHtml(e.message)}</div>`;
    }
  },

  async fetchPage() {
    const params = new URLSearchParams();
    params.set("member", Sidebar.selectedMember);
    if (this.kind) params.set("kind", this.kind);
    params.set("limit", String(this.PAGE_SIZE));
    if (this.oldestTs != null) params.set("before", String(this.oldestTs));
    const data = await fetchJson(`/api/media-list?${params.toString()}`);
    const items = data.items || [];
    this.hasMore = !!data.has_more;
    if (items.length > 0) this.oldestTs = items[items.length - 1].ts;
    return items;
  },

  async loadMore() {
    if (this.loading || !this.hasMore) return;
    this.loading = true;
    const sentinel = qs("#galleryLoadSentinel");
    sentinel.textContent = "読み込み中...";
    sentinel.classList.remove("hidden");
    try {
      const items = await this.fetchPage();
      const grid = qs("#galleryGrid");
      for (const item of items) grid.appendChild(this.buildItem(item));
    } catch (e) {
      console.error(e);
    } finally {
      this.loading = false;
      sentinel.classList.add("hidden");
    }
  },

  onScroll() {
    const body = qs("#galleryBody");
    if (body.scrollHeight - body.scrollTop - body.clientHeight < 200) {
      this.loadMore();
    }
  },

  buildItem(msg) {
    const cell = ce("div", "gallery-item");
    const media = ce("div", "gallery-item-media");

    // サムネイルが無い(動画/音声はindexerがサムネを作らない)場合、<img>にmedia_urlをそのまま
    // 突っ込むと何も表示されない空タイルになってしまうため、種別に応じたプレースホルダを出す。
    const thumbSrc = msg.thumb_url || (msg.kind === "image" ? msg.media_url : null);
    const hasThumb = !!thumbSrc;
    if (thumbSrc) {
      const img = ce("img");
      img.loading = "lazy";
      img.src = thumbSrc;
      img.alt = "";
      media.appendChild(img);
    } else if (msg.kind === "video" || msg.kind === "audio") {
      const placeholder = ce("div", "gallery-item-placeholder");
      const icon = ce("div", "gallery-placeholder-icon");
      icon.textContent = msg.kind === "video" ? "▶" : "🎵";
      const label = ce("div", "gallery-placeholder-label");
      label.textContent = msg.kind === "video" ? "動画" : "音声";
      placeholder.appendChild(icon);
      placeholder.appendChild(label);
      media.appendChild(placeholder);
    }

    // プレースホルダに既に種別ラベルがあるため、バッジは重複させない
    // (サムネイルがある場合のみ、サムネ上に種別を示すバッジを重ねる)
    if (hasThumb && (msg.kind === "video" || msg.kind === "audio")) {
      const badge = ce("div", "gallery-kind-badge");
      badge.textContent = msg.kind === "video" ? "動画" : "音声";
      media.appendChild(badge);
    }

    const jumpBtn = ce("button", "gallery-jump-btn");
    jumpBtn.type = "button";
    jumpBtn.title = "このメッセージへジャンプ";
    jumpBtn.textContent = "→";
    jumpBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      this.close();
      App.jumpToMessage(msg.member, msg.ts, msg.msg_id);
    });
    media.appendChild(jumpBtn);

    cell.appendChild(media);

    const meta = ce("div", "gallery-item-meta");
    const timeEl = ce("div", "gallery-item-time");
    timeEl.textContent = `${formatLastTs(msg.ts)} ${formatTime(msg.ts)}`;
    meta.appendChild(timeEl);
    if (msg.body) {
      const snippet = ce("div", "gallery-item-snippet");
      snippet.textContent = applyNicknamePlaceholder(msg.body);
      meta.appendChild(snippet);
    }
    cell.appendChild(meta);

    // クリック挙動: 画像はライトボックスで開く。動画/音声・ライトボックス非対応時は
    // タイムラインへジャンプする。どの場合も右下の小さな「→」ボタンから
    // 必ずタイムラインへジャンプできるようにしておく。
    cell.addEventListener("click", () => {
      if (msg.kind === "image") {
        openLightbox(msg);
      } else {
        if (isDevMode) {
          console.info("[GalleryPanel] clicked item", { msg_id: msg.msg_id, ts: msg.ts, kind: msg.kind, member: msg.member });
        }
        this.close();
        App.jumpToMessage(msg.member, msg.ts, msg.msg_id);
      }
    });

    return cell;
  },
};

const DisplayPrefs = {
  STORAGE_KEY: "msgviewer_display_prefs",
  DEFAULT_FONT_SIZE: 100,
  DEFAULT_NICKNAME: "ユーザー",

  load() {
    let prefs = {
      fontFamily: "",
      fontSize: this.DEFAULT_FONT_SIZE,
      nickname: this.DEFAULT_NICKNAME,
      volumeBoostEnabled: true,
    };
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      if (raw) prefs = { ...prefs, ...JSON.parse(raw) };
      if (!prefs.nickname) prefs.nickname = this.DEFAULT_NICKNAME;
    } catch (e) {
      console.error(e);
    }
    return prefs;
  },

  save(prefs) {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(prefs));
    } catch (e) {
      console.error(e);
    }
  },

  apply(prefs) {
    const root = document.documentElement;
    if (prefs.fontFamily) {
      root.style.setProperty("--font-family", prefs.fontFamily);
    } else {
      root.style.removeProperty("--font-family");
    }
    root.style.fontSize = `${prefs.fontSize}%`;
    // 既に描画済みの音量ブースト行にも即座に反映する
    // (buildVolumeBoostControl側は生成時にこのフラグを見るが、設定変更時は
    // タイムライン全体を作り直すコストをかけずCSSのhiddenだけ切り替える)。
    document.body.classList.toggle("volume-boost-disabled", !prefs.volumeBoostEnabled);
  },

  init() {
    const prefs = this.load();
    this.apply(prefs);

    const nicknameInput = qs("#settingsNickname");
    const familySelect = qs("#settingsFontFamily");
    const sizeInput = qs("#settingsFontSize");
    const sizeValue = qs("#settingsFontSizeValue");
    const volumeBoostCheckbox = qs("#settingsVolumeBoost");

    nicknameInput.value = prefs.nickname;
    familySelect.value = prefs.fontFamily || "";
    sizeInput.value = prefs.fontSize;
    sizeValue.textContent = `${prefs.fontSize}%`;
    volumeBoostCheckbox.checked = prefs.volumeBoostEnabled;

    nicknameInput.addEventListener("input", () => {
      const current = this.load();
      current.nickname = nicknameInput.value.trim() || this.DEFAULT_NICKNAME;
      this.save(current);
      Timeline.reapplyNicknamePlaceholder();
    });

    familySelect.addEventListener("change", () => {
      const current = this.load();
      current.fontFamily = familySelect.value;
      this.save(current);
      this.apply(current);
    });

    volumeBoostCheckbox.addEventListener("change", () => {
      const current = this.load();
      current.volumeBoostEnabled = volumeBoostCheckbox.checked;
      this.save(current);
      this.apply(current);
    });

    sizeInput.addEventListener("input", () => {
      sizeValue.textContent = `${sizeInput.value}%`;
      const current = this.load();
      current.fontSize = Number(sizeInput.value);
      this.save(current);
      this.apply(current);
    });
  },
};

// 設定 (メッセージ保存フォルダの指定)

const Settings = {
  configured: false,
  TABS: ["folder", "display", "danger"],

  init() {
    qs("#settingsBtn").addEventListener("click", () => this.open());
    qs("#settingsCloseBtn").addEventListener("click", () => this.close());
    qs("#settingsSaveBtn").addEventListener("click", () => this.save());
    qs("#settingsRootInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") this.save();
    });
    qs("#settingsResetBtn").addEventListener("click", () => this.reset());

    for (const btn of document.querySelectorAll(".settings-tab")) {
      btn.addEventListener("click", () => this.switchTab(btn.dataset.tab));
    }
  },

  switchTab(tab) {
    for (const name of this.TABS) {
      const isActive = name === tab;
      qs(`.settings-tab[data-tab="${name}"]`).classList.toggle("active", isActive);
      qs(`#settingsTab${name.charAt(0).toUpperCase()}${name.slice(1)}`).classList.toggle("hidden", !isActive);
    }
  },

  async checkOnStartup() {
    try {
      const data = await fetchJson("/api/settings");
      this.configured = !!data.configured;
      isDevMode = !!data.is_dev;
      if (data.root) qs("#settingsRootInput").value = data.root;
      if (!this.configured) {
        this.open(true);
      }
    } catch (e) {
      console.error(e);
    }
  },

  open(forced = false) {
    qs("#settingsError").classList.add("hidden");
    qs("#settingsModal").classList.remove("hidden");
    qs("#settingsCloseBtn").classList.toggle("hidden", forced && !this.configured);
    this.switchTab("folder");
    for (const name of ["display", "danger"]) {
      qs(`.settings-tab[data-tab="${name}"]`).disabled = !this.configured;
    }
  },

  close() {
    if (!this.configured) {
      toast("先にメッセージ保存フォルダを設定してください", true);
      return;
    }
    qs("#settingsModal").classList.add("hidden");
  },

  async save() {
    const input = qs("#settingsRootInput");
    const root = input.value.trim();
    const errEl = qs("#settingsError");
    errEl.classList.add("hidden");
    if (!root) {
      errEl.textContent = "フォルダパスを入力してください";
      errEl.classList.remove("hidden");
      return;
    }
    const btn = qs("#settingsSaveBtn");
    btn.disabled = true;
    try {
      const res = await fetch("/api/settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ root }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || `HTTP ${res.status}`);
      }
      this.configured = true;
      qs("#settingsModal").classList.add("hidden");
      toast("保存先フォルダを設定しました。取り込みを開始します。");
      Reindex.showRunning({ phase: "scanning", message: "取り込みを開始しています..." });
      Reindex.startActivePolling();
      Reindex.poll();
      await Sidebar.load();
    } catch (e) {
      console.error(e);
      errEl.textContent = e.message;
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  },

  async reset() {
    const errEl = qs("#settingsResetError");
    errEl.classList.add("hidden");

    const ok = window.confirm(
      "DB・サムネイル・保存先フォルダ設定をすべて削除します。この操作は元に戻せません。実行しますか？"
    );
    if (!ok) return;

    const btn = qs("#settingsResetBtn");
    btn.disabled = true;
    try {
      const res = await fetch("/api/reset", { method: "POST" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || `HTTP ${res.status}`);
      }
      toast("初期化しました。");
      setTimeout(() => location.reload(), 600);
    } catch (e) {
      console.error(e);
      errEl.textContent = e.message;
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  },
};
